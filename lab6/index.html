<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <h2>Student Portal</h2>
            <nav>
                <button onclick="changeContent('dining')">Dining Menus</button>
                <button onclick="changeContent('athletics')">Athletics</button>
                <button onclick="changeContent('academics')">Academics</button>
            </nav>
        </aside>

        <main class="content-area">
            <div id="dynamic-content">
                <h2>Welcome to the Portal</h2>
                <p>Select an option from the sidebar to view updates.</p>
            </div>
        </main>
        
    </div>
    
    <script src="script.js"></script>

</body>
</html>
