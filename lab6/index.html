<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rylie's Portfolio</title>
    <!-- Google Fonts for a fun but readable font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2 id="home-btn" class="sidebar-title">Rylie's Portfolio</h2>
            <nav class="nav-menu">
                <button class="nav-btn" data-target="academics">Academics</button>
                <button class="nav-btn" data-target="involvement">Involvement</button>
                <button class="nav-btn" data-target="volunteering">Volunteering</button>
                <button class="nav-btn" data-target="work">Work Experience</button>
            </nav>
        </aside>

        <!-- Main Body Content Area -->
        <main class="main-content">
            <div id="content-card" class="content-card">
                <h1 id="content-title">Welcome to My Portfolio</h1>
                <p id="content-text">Select an option from the sidebar to view updates on different areas of my life.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
