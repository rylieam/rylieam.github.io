<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Wellness Journal - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fafafa;
            border: 2px solid #e0e0e0;
            padding: 25px;
            border-radius: 8px;
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card:hover {
            border-color: #4a90e2;
            background: #f0f7ff;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CHOOSE YOUR PAGE</h1>
        <div class="grid">
            <a href="homework/" class="card">📋 Homework Tracker</a>
            <a href="chores/" class="card">🧹 Chore Chart</a>
            <a href="mealPrep/" class="card">🥗 Meal Prep / Pack Food List</a>
            <a href="bookshelf/" class="card">📚 Book Shelf</a>
            <a href="moodTracker/" class="card">🎨 Mood Tracker</a>
            <a href="journal/" class="card">📖 Nightly Journal</a>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
