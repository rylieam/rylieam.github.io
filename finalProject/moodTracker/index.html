<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood Tracker - December</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="moodTracker.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="navigationPage/" class="back-btn">&larr;</a>
      <h1>Mood Tracker: December</h1>
      <button id="log-mood-btn">Log Today's Mood</button>
    </header>
    
    <div class="legend">
      <span class="legend-item"><span class="box happy"></span> Happy</span>
      <span class="legend-item"><span class="box sad"></span> Sad</span>
      <span class="legend-item"><span class="box mad"></span> Mad</span>
      <span class="legend-item"><span class="box anxious"></span> Anxious</span>
      <span class="legend-item"><span class="box stressed"></span> Stressed</span>
      <span class="legend-item"><span class="box sick"></span> Sick</span>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
