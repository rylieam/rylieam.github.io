<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wellness Journal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      justify-content: center;
      background-color: #fdfbf7;
    }

    .cover-card {
      position: relative;
      width: 100%;
      max-width: 650px;
      min-height: 520px;
      background: #ffffff;
      border: 2px solid #e2ddd5;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 30px;
      text-align: center;
      overflow: hidden;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .cover-card.opening {
      transform: scale(1.03);
      opacity: 0;
    }

    .cover-title {
      font-size: 2.6rem;
      letter-spacing: 4px;
      line-height: 1.4;
      color: #4a5568;
      font-weight: 700;
      margin-bottom: 50px;
      z-index: 2;
    }

    .open-book-btn {
      background: transparent;
      color: #d97757;
      border: 2px solid #d97757;
      padding: 14px 34px;
      font-size: 1.15rem;
      letter-spacing: 3px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 2;
    }

    .open-book-btn:hover {
      background: #d97757;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(217, 119, 87, 0.25);
    }

    /* Subtle hand-drawn style hearts from the prototype */
    .heart {
      position: absolute;
      color: #f3d5c8;
      font-size: 1.8rem;
      user-select: none;
      z-index: 1;
    }
    .h1 { top: 15%; left: 14%; transform: rotate(-15deg); }
    .h2 { top: 20%; right: 16%; transform: rotate(12deg); font-size: 1.4rem; }
    .h3 { bottom: 22%; left: 18%; transform: rotate(-10deg); font-size: 1.5rem; }
    .h4 { bottom: 16%; right: 15%; transform: rotate(18deg); }
    .h5 { top: 48%; left: 10%; transform: rotate(-20deg); font-size: 1.2rem; }
    .h6 { top: 52%; right: 11%; transform: rotate(15deg); font-size: 1.3rem; }
  </style>
</head>
<body>
  <div class="cover-card" id="cover-card">
    <span class="heart h1">&#9825;</span>
    <span class="heart h2">&#9825;</span>
    <span class="heart h3">&#9825;</span>
    <span class="heart h4">&#9825;</span>
    <span class="heart h5">&#9825;</span>
    <span class="heart h6">&#9825;</span>

    <h1 class="cover-title">YOUR WELLNESS<br>JOURNAL</h1>
    <button id="open-book-btn" class="open-book-btn">OPEN BOOK</button>
  </div>

  <script src="cover.js"></script>
</body>
</html>
