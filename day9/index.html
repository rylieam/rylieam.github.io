<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Game Day Checklist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Carolina Game Day Checklist</h1>
    </header>

    <main>
        <!-- The Input Area -->
        <div class="input-section">
            <label for="newItem">Add an item to your bag:</label>
            <input type="text" id="newItem" placeholder="e.g., Clear stadium bag">
            <button onclick="addItem()">Add to List</button>
        </div>

        <!-- The Display Area -->
        <ul id="checklist-display">
            <!-- JavaScript will inject the <li> elements here -->
        </ul>
    </main>

    <!-- External Script loaded at the bottom -->
    <script src="script.js"></script>

</body>
</html>
